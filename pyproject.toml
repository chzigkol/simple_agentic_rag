[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG over medical Q&A, medical device manuals, and web search."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb>=1.1.0",
    "deepeval>=4.0.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.2.0",
    "openai>=2.0.0",
    "opentelemetry-api>=1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    "pandas>=2.3.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.0.0",
    "mypy>=1.19.0",
    "pandas-stubs>=2.3.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[project.scripts]
agentic-rag-evaluate = "agentic_rag.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["agentic_rag"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "langchain_tavily.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:rerunfailures"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
